  # ADD ADR-013/014/015/016 (GMI_Decision_Document_v1.docx): Broad Dollar
  # Index basket-input completion. Architecture v2.0 §7.2's own
  # compute_broad_dollar() design specifies 10 forex pairs as inputs; only
  # 6 (EUR_USD, USD_JPY, GBP_USD, USD_CAD, USD_CHF, AUD_USD — all Layer 1)
  # plus USD_IDR (Layer 1, weight logic changes per ADR-018) existed
  # anywhere in the universe. These 6 net-new EM/DM-differentiating legs
  # close that gap. contributes_to is deliberately empty — this subcategory
  # supplies raw Bronze/Silver ingestion for a future CrossAssetEngine
  # compute_broad_dollar() to consume directly (hardcoded-basket-dict
  # pattern, same as the original design), NOT a domain-score contributor
  # in its own right (ADR-014). Per-currency basket weights (incl. HKD's
  # near-zero token weight, ADR-015; IDR's platform-relevance override,
  # ADR-018) are a CrossAssetEngine-internal concern, not yet built —
  # see GMI_Decision_Document_v1.docx §6 Gate 1 (BIS EER weight-component
  # sourcing, blocking exact numeric values) and §8 Gate 2 (yfinance ticker
  # convention, non-blocking — USD<CCY>=X used here for consistency with
  # the existing USD_CAD/USD_CHF/USD_JPY convention, live-unconfirmed for
  # the 6 currencies below except CNH per ADR-013).
  dollar_basket:
    _meta:
      subcategory_id: context_dollar_basket
      source: yfinance
      description: Broad Dollar Index basket-completion currencies — EM/DM legs beyond DXY's 6-currency composition
      contributes_to: []
    instruments:
    - symbol: CNH
      yfinance_symbol: USDCNH=X
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      timezone: UTC
      notes: 'ADR-013: offshore renminbi (not onshore CNY) — avoids PBOC policy-rate/managed-FX double-counting with context_rates_em_cb. Ticker confirmed live (USDCNH=X and CNH=X both exist on Yahoo Finance).'
    - symbol: KRW
      yfinance_symbol: USDKRW=X
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      timezone: UTC
      notes: 'Ticker convention unconfirmed live — Gate 2 (GMI_Decision_Document_v1.docx §6), non-blocking.'
    - symbol: SGD
      yfinance_symbol: USDSGD=X
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      timezone: UTC
      notes: 'ADR-016: included on standalone FX-policy grounds — MAS manages policy via the S$NEER exchange-rate band rather than an interest rate, making SGD a direct policy-transmission signal (no CB-rate or equity-index anchor elsewhere in the universe). Ticker convention unconfirmed live — Gate 2, non-blocking.'
    - symbol: HKD
      yfinance_symbol: USDHKD=X
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      reliability_flag: true
      timezone: UTC
      notes: 'ADR-015: Hong Kong Linked Exchange Rate System pegs HKD to USD in a ~7.75-7.85 band since 1983 — near-flat noise under normal conditions, included at a near-zero token basket weight (exact value set inside CrossAssetEngine when built) rather than excluded outright, so a future peg-break event is not structurally invisible. Same reliability_flag pattern as SSEC (Architecture v2.0 §3.5) and the BOJ YCC annotation. Ticker convention unconfirmed live — Gate 2, non-blocking.'
    - symbol: TWD
      yfinance_symbol: USDTWD=X
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      timezone: UTC
      notes: 'Ticker convention unconfirmed live — Gate 2, non-blocking.'
    - symbol: NOK
      yfinance_symbol: USDNOK=X
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      timezone: UTC
      notes: 'DM basket leg. Ticker convention unconfirmed live — Gate 2, non-blocking.'
  # ADD ADR-024 (GMI_Decision_Document_v2.docx): point-fix FX anchor for
  # CPO's future MYR->USD Silver-layer normalization (ADR-023 narrowed
  # Wave 2's MYR dependency to CPO alone — TIN/RUBBER are USD-native).
  # Deliberately NOT folded into context_dollar_basket above — two
  # unrelated purposes (Broad Dollar Index computation vs. a single
  # commodity's currency conversion) kept under separate labels per
  # ADR-024's rationale. contributes_to is empty: zero domain-score
  # weight. NOT a CrossAssetEngine input when that engine is built —
  # sole consumer is the future Silver-layer CPO normalization join
  # (CPO_usd = CPO_myr / MYR_USD_rate), which is why
  # include_in_forecast=false here despite context_available=true.
  fx_normalization:
    _meta:
