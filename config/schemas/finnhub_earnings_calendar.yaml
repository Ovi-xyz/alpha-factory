# config/schemas/finnhub_earnings_calendar.yaml — RISK-4 remediation
# Bronze Schema Registry entry (GD §3.7) for FinnhubIngester._ingest_earnings_calendar().
#
# Field shapes verified against Finnhub's documented /calendar/earnings
# response (2026-07, via public API reference and community SDK struct
# definitions — this sandbox has no live network access to Finnhub itself,
# so the schema is grounded in documented field names/nullability rather
# than a live response sample; see KNOWN_RISKS.md RISK-4 resolution note).
#
# Nullability: epsActual, epsEstimate, revenueEstimate, quarter, year are
# ALL documented as optional/nullable by Finnhub. In practice, since this
# ingester fetches a 90-day FORWARD window (run_date -> run_date+90),
# eps_actual/revenue_actual are expected to be null for essentially every
# row (the earnings haven't happened yet) — this is the NORMAL case, not
# an error state, and on_mismatch must not quarantine data on this basis.
version: "2026-07"
source: finnhub
domain: fundamental_earnings_calendar
expected_columns:
  - name: symbol
    type: string
    nullable: false
  - name: earnings_date
    type: string
    nullable: false
  - name: eps_estimate
    type: float64
    nullable: true
  - name: eps_actual
    type: float64
    nullable: true    # expected null for nearly all rows — future 90-day window
  - name: revenue_estimate
    type: float64
    nullable: true    # Finnhub source value may be int-shaped (whole $) or
                       # float-shaped depending on the observation; ingester
                       # casts to float64 explicitly before write so the
                       # schema contract is stable regardless (see FIX RISK-4).
  - name: quarter
    type: int64
    nullable: true
  - name: year
    type: int64
    nullable: true
  - name: fetched_date
    type: string
    nullable: false
on_mismatch: quarantine   # GD §3.7 — mismatch -> quarantine, never silent-fail
