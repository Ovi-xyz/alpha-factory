# instruments_identity.yaml — Sourcing/identity fields ONLY.
# GMI Decision Document v5 §2.1 (Decision B Step 2) — split from the single
# config/instruments.yaml (v1.5, 1629 lines) into two files by concern:
# this file (WHAT/WHERE to fetch: symbol, raw_symbol, yfinance_symbol,
# tvfeed_symbol, timezone, base_currency, proxy_instrument) plus its sibling
# instruments_taxonomy.yaml (classification, routing, domain-score weights,
# _meta.contributes_to blocks). Joined positionally at load time by
# src/config/yaml_split_merge.py — SAME tree path/list index in both files
# = SAME instrument. 'symbol' is intentionally repeated in both files as a
# self-checking anchor (see yaml_split_merge.py docstring). Do not add
# taxonomy/routing fields here — see instruments_taxonomy.yaml instead.
# Full field-classification table and rationale: CHANGELOG.md ADR-027.

