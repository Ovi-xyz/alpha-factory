# config/schemas/treasury_yield.yaml — Bronze Schema Registry (GD §3.7)
#
# GAP-3 fix (Production Readiness Assessment v1.7.2) requested this file as
# one of 6 missing schemas. Read this note before wiring a SchemaValidator
# call against it — the Treasury ingestion path is architecturally
# different from the other 5 sources fixed under GAP-3.
#
# ARCHITECTURE NOTE: src/bronze/treasury_ingester.py does NOT write Bronze
# data itself. TreasuryIngester.run() (FIX TRES-1) delegates entirely to
# FREDIngester().run(run_date, series_filter=TREASURY_FRED_SERIES) — the
# 13 DGS/spread series below are fetched and written by FREDIngester under
# data/bronze/macro/fred/, and are therefore ALREADY validated at write
# time by fred_macro.yaml (see TI-1 fix note in treasury_ingester.py: the
# class doesn't even inherit BronzeIngester anymore, since it never calls
# .write() or .write_macro()). There is no independent
# data/bronze/bond/treasury/ write path for this schema to gate — wiring a
# second SchemaValidator("treasury_yield.yaml") call into
# TreasuryIngester.run() would have nothing to validate against, since no
# DataFrame is ever constructed there.
#
# This file therefore serves as a REGISTRY / DOCUMENTATION contract for the
# 13 yield-curve tenor series (GD §3.3.3 "Treasury Fiscal Data"), useful if:
#   (a) a downstream consumer wants the canonical tenor -> FRED series_id /
#       label mapping without importing treasury_ingester.py, or
#   (b) Treasury is ever migrated to a dedicated native API (the GD §3.3.3
#       description of a standalone "no API key required" Treasury Fiscal
#       Data source is NOT what's currently implemented — current behavior
#       is a 100% FRED delegation, a deliberate deviation documented in
#       TRES-1). If that migration happens, this file is the starting point
#       for a real SchemaValidator wiring against the new ingester's output.
#
# expected_columns below describes the FRED row shape AFTER it lands in
# Silver (TENOR_LABELS-mapped), since that's the only schema this Treasury
# domain meaningfully owns today. The raw Bronze validation for these rows
# happens via fred_macro.yaml at ingestion time.

version: "2026-06"
source: treasury
domain: bond
# NOT actively instantiated by any SchemaValidator() call — see ARCHITECTURE
# NOTE above. Present for registry/documentation purposes and as the
# contract to wire up if/when a native Treasury Fiscal Data ingester (GD
# §3.3.3) replaces the current FRED-delegation implementation.
on_mismatch: quarantine

tenors:
  - { fred_series_id: DGS1MO,       label: 1M }
  - { fred_series_id: DGS3MO,       label: 3M }
  - { fred_series_id: DGS6MO,       label: 6M }
  - { fred_series_id: DGS1,         label: 1Y }
  - { fred_series_id: DGS2,         label: 2Y }
  - { fred_series_id: DGS5,         label: 5Y }
  - { fred_series_id: DGS7,         label: 7Y }
  - { fred_series_id: DGS10,        label: 10Y }
  - { fred_series_id: DGS20,        label: 20Y }
  - { fred_series_id: DGS30,        label: 30Y }
  - { fred_series_id: T10Y2Y,       label: spread_10y2y }
  - { fred_series_id: T10Y3M,       label: spread_10y3m }
  - { fred_series_id: MORTGAGE30US, label: mortgage_30y }

expected_columns:
  - name: observation_date
    type: date
    nullable: false

  - name: value
    type: float64
    nullable: true

  - name: series_id
    type: string
    nullable: false

  - name: release_date
    type: string
    nullable: false
