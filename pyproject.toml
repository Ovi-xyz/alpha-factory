[tool.poetry]
name = "alpha-factory"
version = "1.15.0"
# FIX (Ovi, 9 Aug 2026): three-part session, none touching src/ --
# (1) RISK-15's live-FRED half confirmed on the M1 (all 6 Track 2 series
# PASS); (2) Gate 1 (RISK-16) targeted extraction pass authored --
# extract_us_weights_from_sheet() + --extract-weights CLI mode on
# check_bis_eer_weights.py, unit-tested against a synthetic workbook, not
# yet run against the real bis.org file; (3) proxy correlation studies
# authored -- new scripts/preflight/check_proxy_correlation.py
# (CPO/RUBBER/TIN/NICKEL vs. their RISK-15 FRED benchmarks), not yet run
# against real yfinance/FRED. 28 new tests (11 + 17), all passing
# alongside the 43 pre-existing preflight-script tests in an isolated
# sandbox before either script touched the real repo. See
# dev-log/2026-08-09-risk15-live-confirm-gate1-extraction-proxy-correlation.md
# FIX RISK-15 (Ovi, 8 Aug 2026): KNOWN_RISKS.md RISK-15 (FRED Track 2
# commodity supplements, flagged 30 Jul 2026) resolved. config/
# fred_series.yaml gained a new `commodity` domain -- 6 series: 2
# pre-existing per Architecture Extension v1.0 ADR-005/006 (Iron Ore,
# Coal Australia) that were decided but never actually added, + 4 new
# per ADR-030-033 (Palm Oil/CPO, Rubber, Tin, Nickel -- the yfinance
# proxy pairing from GMI_Decision_Document_v7.docx). All 6 series IDs
# verified against live fred.stlouisfed.org this thread (web search,
# not this sandbox's network -- api.stlouisfed.org has never been
# reachable from here either). Found and corrected a real bug in the
# process: Iron Ore's actual FRED series ID is PIORECRUSDM, not the
# PIORECRORECUSDM both ADR-005 and KNOWN_RISKS.md itself had been
# citing unverified since 25 Jun 2026 -- a duplicated "ORE" typo. src/
# bronze/fred_ingester.py gained matching RELEASE_LAG_DAYS entries (25d
# each, matching the existing PPI-series precedent and the ~24d
# publication lag observed live). New preflight script authored:
# scripts/preflight/check_fred_commodity_series.py (none of the 4
# existing scripts in that directory covered FRED). MINOR bump (not
# PATCH) -- judgment call: this activates real new data flow into
# Bronze on the next bronze_macro_weekly run ("new indicator" per this
# project's own CI/CD Ops Guide versioning semantics), even though no
# live Gold-layer consumer exists yet (ForecastModule/CrossAssetEngine
# not built). 1422 -> 1432 tests (+10), coverage unchanged. See
# CHANGELOG.md and KNOWN_RISKS.md RISK-15 for full detail.
#
# FIX BIS-1, Gate 1 progress + TYPE decision (Ovi, 3 Aug 2026): Gate 1
# substantially advanced -- BIS's actual Broad EER weights file located
# (data.bis.org/topics/EER's own Methodology section links directly to
# bis.org/statistics/eer/weightsb.xlsx, confirmed real and reachable).
# check_bis_eer_weights.py gets a new --discover-weights mode (openpyxl,
# promoted to explicit dependency below). TYPE decided: Nominal, not Real
# (matches DXY's own nominal nature; BIS confirms Daily EER exists only
# for Nominal). FREQ now wildcarded (was fixed M) so daily data comes
# through where it exists. Endpoint renamed BIS_EER_ENDPOINT_MONTHLY ->
# BIS_EER_ENDPOINT (no longer accurately "monthly-only"). PATCH bump:
# bug/gap-closure work, no interface-contract or Silver/Gold schema
# change. See CHANGELOG.md and KNOWN_RISKS.md RISK-16 for full detail.
#
# FIX BIS-1 continued (Ovi, same thread): HKD/TWD/NOK added to
# check_bis_eer_weights.py's Broad Dollar basket (13/13 currencies
# complete); endpoint key refactored to derive from
# BROAD_DOLLAR_REF_AREAS.values() rather than a hand-duplicated literal.
# FIX BIS-1's core fix (WS_CBPOL/WS_EER) confirmed LIVE on the M1 this
# thread -- KNOWN_RISKS.md RISK-16 -> RESOLVED. PATCH bump: bug fix +
# scope completion, no interface-contract or Silver/Gold schema change.
#
# FIX BIS-1 (Ovi, 1 Aug 2026): PATCH bump -- root-cause fix for the BIS
# CBPOL/EER 404/501s (config/bis_cb_rates.yaml, src/bronze/
# bis_rates_ingester.py, scripts/preflight/check_bis_cbpol_d.py,
# scripts/preflight/check_bis_eer_weights.py, + tests). No interface-
# contract or Silver/Gold schema change -- PATCH, not MINOR. See
# CHANGELOG.md and KNOWN_RISKS.md RISK-16 for the full evidence trail.
#
# FIX ADR-029/030-033 (GMI_Decision_Document_v7.docx, 30 Jul 2026): version
# bump folds in both this thread's work (tvdatafeed retirement, 4 Layer 2
# proxy activations) AND a catch-up for several prior threads that landed
# on live main without ever bumping this string (ADR-027 instruments.yaml
# split, Decision C coverage tranche was captured at 1.12.1, GMI v6 Decision
# E preflight extension + G-6 trigger completion, ADR-028 poetry bootstrap
# check, the 28 Jul 2026 preflight-fixes/coverage-option-b thread, and the
# check_yfinance_tickers.py --candidates addition). None of these bumped
# this field -- it sat at 1.12.1 throughout, several real changes behind
# live content (flagged in GMI_Decision_Document_v7.docx §4, "Ovi's call on
# scope"). MINOR (not PATCH) chosen deliberately: rather than guess at
# phantom 1.12.2/1.12.3/1.12.4 patch numbers that were never actually
# stamped anywhere except informal zip filenames, one clean MINOR jump
# avoids implying false precision about which prior thread owns which
# patch digit. See CHANGELOG.md for the full catch-up entry.
description = "Data Platform — Bronze/Silver/Gold Medallion Architecture"
authors = ["Ovi"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
polars = {extras=["all"], version=">=0.20"}
duckdb = ">=1.0"
pyarrow = ">=14.0"
yfinance = ">=0.2.36"
# REMOVED FIX ADR-029 (GMI_Decision_Document_v7.docx, 30 Jul 2026): tvdatafeed
# retired entirely as a platform dependency. Signin had been failing since
# >=29 Jul 2026 (nologin fallback mode; every non-IDX exchange fetch timed
# out even on a nominally "healthy" session -- see
# alpha-factory_preflight_logs___29_July_2026.txt). yfinance .JK was already
# the tested ChainedAdapter fallback for IDX30 and is now its sole source.
# TvDatafeedAdapter/TvDatafeedSessionManager archived to scripts/archive/
# (see scripts/archive/README.md). See KNOWN_RISKS.md RISK-1 (RESOLVED).
# NOTE: this pyproject.toml edit alone did not regenerate poetry.lock --
# confirmed via a local `poetry lock` run 31 Jul 2026 that tvdatafeed and
# its transitive deps WERE dropped then. The lock went stale again after
# the 3 Aug openpyxl promotion below (content-hash no longer matched
# pyproject.toml -- `poetry install`/`poetry check` hard-failed:
# "pyproject.toml changed significantly since poetry.lock was last
# generated"). FIXED 4 Aug 2026 via Filesystem MCP connector: regenerated
# in an isolated sandbox with PyPI network access (poetry 2.4.1) against
# the exact live files; `poetry check` + `poetry install --no-root
# --dry-run` both verified clean. Diffed old vs new lock: 113/113 packages
# identical name+version -- only the content-hash line changed.
pandas = ">=2.0"
# FIX ADR-020 (GMI_Decision_Document_v2.docx, 2026-07-11): pandas-ta -> pandas-ta-classic.
# PyPI removed pandas-ta's entire 0.3.x line (incl. the stated floor 0.3.14);
# only two Python-3.12-only prerelease builds remain (0.4.67b0, 0.4.71b0), and
# even on 3.12 the bare >=0.3.14 constraint fails to resolve since pip excludes
# prereleases from an explicit floor by default. pandas-ta-classic is a
# maintained continuation of the same abandoned 0.3.x lineage with genuine
# stable releases (up to 0.6.52) — Python floor held at >=3.11, not bumped.
pandas-ta-classic = ">=0.3.14"
finnhub-python = "*"
polygon-api-client = "*"
fredapi = "*"
loguru = "*"
# REMOVED (this thread, July 2026): pydantic — confirmed unused a second
# time (zero imports anywhere in src/ or scripts/, re-verified via grep),
# same disposition alpha-vantage got once its own "flagged, not removed"
# state (Decision B Step 3 / GMI_Decision_Document_v5.docx §2.2) was
# reconfirmed. `poetry remove pydantic` — pyproject.toml and poetry.lock
# both updated consistently. See CHANGELOG.md for the full entry.
pyyaml = "*"
# ADD Decision B Step 3: promoted from transitive (was resolving only via
# poetry.lock, zero explicit import anywhere) to an explicit direct
# dependency — declare what you import, matching the Poetry-single-
# source-of-truth principle Decision A established.
jsonschema = ">=4.0"
# ADD FIX BIS-1 continued (Ovi, 3 Aug 2026): same treatment as jsonschema
# above — was resolving only transitively (via polars[all]'s optional
# read_excel backend), zero explicit import anywhere until
# check_bis_eer_weights.py::_discover_weights() needed it directly to
# inspect BIS's published Broad EER weights file (Gate 1, ADR-017/018).
openpyxl = ">=3.1"
tenacity = "*"
python-dotenv = "*"
hmmlearn = "*"
scikit-learn = "*"
# ADD ADR-021 (GMI_Decision_Document_v2.docx): promoted from ad hoc
# sandbox-only installs to hard dependencies. Unconditionally required by
# GMI Wave 1 Cycle 4 (CrossAssetEngine): CorrelationModule (Ledoit-Wolf
# shrinkage, hierarchical clustering), LeadLagModule (Granger causality +
# BH-FDR), ForecastModule (VAR). Declaring them now — after ADR-020 settled
# the Python floor — avoids pinning blind and discovering a wheel-
# availability gap later, the same failure mode this thread diagnosed for
# pandas-ta.
scipy = "*"
statsmodels = "*"
httpx = "*"
requests = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:polars",
]

[tool.coverage.run]
source = ["src"]
omit   = [
    "src/backtest/*",         # Requires live data
    "src/scheduler/pipeline_scheduler.py",  # APScheduler optional
    "*/conftest.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass$",
    "logger\\.debug",
]
show_missing  = true
skip_covered  = false
fail_under    = 80     # FIX (30 Jul 2026): was stale at 70 -- ci.yml has
                        # enforced --cov-fail-under=80 since the 28 Jul 2026
                        # preflight-fixes/coverage-option-b thread (Decision
                        # F Option B, GMI_Decision_Document_v6.docx §4); this
                        # field was never updated to match, so a bare
                        # `pytest --cov=src --cov-fail-under` run (no
                        # explicit CLI override) would silently enforce the
                        # wrong, looser threshold. No behavior change to CI
                        # itself (ci.yml's explicit flag already overrode
                        # this), just removing a number that looked like it
                        # enforced something without reflecting reality --
                        # same class of gap this project's own G-6 trigger
                        # history (GMI_Decision_Document_v6.docx §1.1) warns
                        # about.
