        # bulks/physical-shipping characteristics too (Addendum §2.2), but
        # OD-C6 left true dual-registration as a future CrossAssetEngine
        # cluster-analysis enhancement, not yet built — a single-value
        # field matches what was actually decided, not what was deferred.
        commodity_role: context
        commodity_subcategory: base_metals
        notes: VALE proxy — ~67pct revenue from iron ore. Corr ~0.81 vs SGX benchmark
      - symbol: TIN
        yfinance_symbol: null
        layer: 2
        context_category: context_commodity_metals
        context_group: commodity
        context_available: false
        include_in_forecast: false
        commodity_role: context
        commodity_subcategory: base_metals
        # FIX ADR-023 (GMI_Decision_Document_v2.docx): TIN is USD-native via
        # LME (tvdatafeed LME|SN) — it does NOT require MYR->USD
        # normalization. The original Architecture Extension v1.0 framing
        # (grouping TIN with CPO/RUBBER as MYR-blocked) was superseded by
        # Architecture v2.1 Addendum's more specific routing decision and is
        # corrected here. Still deferred — blocked only on tvdatafeed
        # ticker/exchange verification (Addendum §11 OD-C1), unrelated to
        # currency.
        deferred_reason: tvdatafeed LME ticker/exchange verification pending (OD-C1) — not currency-related
        planned_wave: 2
        requires_fx_normalization: false
        base_currency: USD
