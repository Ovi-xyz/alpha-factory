# instruments_taxonomy.yaml — Classification, routing, and domain-score
# fields ONLY (layer, context_category/group, context_available,
# include_in_forecast, proxy_for, proxy_correlation_expected,
# reclassified_from, deferred_reason, planned_wave, reliability_flag,
# exclude_from_lead_lag_leader, commodity_role, commodity_subcategory,
# requires_fx_normalization, structural_break, notes, and every _meta
# (contributes_to) block). GMI Decision Document v5 §2.1 (Decision B Step
# 2) — split from config/instruments.yaml (v1.5). Sibling file
# instruments_identity.yaml carries sourcing fields. Joined positionally at
# load time by src/config/yaml_split_merge.py. 'symbol' is intentionally
# repeated here too, as a self-checking anchor against the identity file —
# see yaml_split_merge.py docstring. All 15 hand-written ADR-rationale
# comment blocks from the pre-split file live here (100% of them anchor to
# taxonomy-side fields — none were taxonomy-adjacent-only in identity).
# Full field-classification table and rationale: CHANGELOG.md ADR-027.

