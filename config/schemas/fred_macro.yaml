# config/schemas/fred_macro.yaml — Bronze Schema Registry (GD §3.7)
#
# GAP-3 fix (Production Readiness Assessment v1.7.2): FRED was one of 6 of
# 11 Bronze sources with no schema YAML, so SchemaValidator could never be
# instantiated for it and the GD §3.7 quarantine gate never fired — a
# silent FRED API column rename/retype would have flowed straight into
# Silver undetected.
#
# Producer : src/bronze/fred_ingester.py (FREDIngester._fetch_series)
# Consumer : src/silver/macro_processor.py (MacroProcessor.process_fred)
# Cadence  : weekly for most series, daily for high-frequency ones
#            (T10Y2Y, VIXCLS — see RELEASE_LAG_DAYS in fred_ingester.py)
# Coverage : 60+ series across monetary policy, inflation, growth, labor,
#            credit, housing (config/fred_series.yaml registry)
#
# Columns reflect _fetch_series()'s actual DataFrame construction
# (pl.from_pandas of a pandas DataFrame built from fredapi.get_series()
# output) BEFORE BronzeIngester.write_macro() appends its own _source /
# _ingested_at / _series_id metadata columns — those three are Bronze
# audit metadata, not part of this contract, and are intentionally
# excluded here (same convention as yfinance_ohlcv.yaml / polygon_ohlcv.yaml,
# which only describe the source-specific payload columns).
#
# Field notes:
#   observation_date — pandas DatetimeIndex.date -> pl.from_pandas infers
#                       Polars Date (not string). Verified empirically:
#                       a Python date object column round-trips to `Date`.
#   value             — nullable: true. fredapi can return NaN/missing
#                        observations for some series during partial
#                        revisions; treated as a benign gap, not a schema
#                        violation. Column existence + exact type are this
#                        gate's primary defense (GD §3.7 motivation), not
#                        nullability.
#   series_id         — NOT nullable: every row is constructed inside the
#                        per-series fetch loop with a literal series_id.
#   release_date      — NOT nullable: FIX FRED-1 computes this for every
#                        row via RELEASE_LAG_DAYS proxy, no conditional skip.

version: "2026-06"
source: fred
domain: macro
on_mismatch: quarantine

expected_columns:
  - name: observation_date
    type: date
    nullable: false

  - name: value
    type: float64
    nullable: true   # fredapi may report NaN for partial/unrevised periods

  - name: series_id
    type: string
    nullable: false

  - name: release_date
    type: string
    nullable: false   # FIX FRED-1: RELEASE_LAG_DAYS proxy, always computed
