# config/fred_series.yaml — IDD §5: FRED Series Registry
# 68 series dikelompokkan per domain macro.
# FIX ADR-041 (GMI_Decision_Document_v9.docx, 14 Aug 2026): 5 dead/redundant
# series pruned after check_fred_series.py's first live run (14 Aug 2026) --
# GOLDAMGBD228NLBM (deleted FRED 2022-01-31), NAPM/NMFCI (deleted FRED
# 2016-06-24, no free replacement), PPIFGS (discontinued by BLS ~Feb 2016,
# redundant w/ PPIFIS), CSCICP03USM665S (frozen since 2024-01, redundant
# w/ UMCSENT). None were in regime_inputs. 67 -> 62.
# FIX ADR-042 (GMI_Decision_Document_v9.docx, 14 Aug 2026): 6 Treasury
# tenors registered (DGS1MO/DGS3MO/DGS6MO/DGS1/DGS7/DGS20) -- previously
# declared in treasury_ingester.py's TREASURY_FRED_SERIES but silently
# dropped by FREDIngester.run()'s series_filter (can only retain series
# already present in this registry). Closes the gap between GD v1.2
# §3.3.3's stated "full 1M-30Y yield curve" and what Bronze actually
# ingested (previously only 2Y/5Y/10Y/30Y). 62 -> 68.
# Dibaca oleh src/bronze/fred_ingester.py

version: "1.0"
cadence_default: weekly    # pipeline fetch cadence (lebih sering dari release)

# Subset yang masuk macro regime computation
regime_inputs:
  vix_proxy:        VIXCLS
  yield_spread:     T10Y2Y
  cpi:              CPIAUCSL
  gdp_growth:       A191RL1Q225SBEA
  dxy_proxy:        DEXUSEU        # inverse untuk DXY proxy
  financial_stress: NFCI
  credit_spread:    BAMLH0A0HYM2

series:
  # ── 1. Monetary Policy & Rates (18) ──────────────────────────────────────
  - {id: FEDFUNDS,     domain: monetary_policy, frequency: monthly, cadence: weekly,  regime_input: true,  description: Federal Funds Effective Rate}
  - {id: DFF,          domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: Federal Funds Rate daily}
  - {id: T10Y2Y,       domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: true,  description: 10Y-2Y Yield Spread — recession signal}
  - {id: T10Y3M,       domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 10Y-3M Spread — leading recession indicator}
  # FIX ADR-042: 6 missing Treasury tenors registered — closes the gap
  # treasury_ingester.py's TREASURY_FRED_SERIES always declared but
  # FREDIngester's series_filter could never retain (registry-absent).
  - {id: DGS1MO,       domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 1-Month Treasury Constant Maturity Rate}
  - {id: DGS3MO,       domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 3-Month Treasury Constant Maturity Rate}
  - {id: DGS6MO,       domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 6-Month Treasury Constant Maturity Rate}
  - {id: DGS1,         domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 1-Year Treasury Constant Maturity Rate}
  - {id: DGS2,         domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 2-Year Treasury Constant Maturity}
  - {id: DGS5,         domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 5-Year Treasury Constant Maturity}
  - {id: DGS7,         domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 7-Year Treasury Constant Maturity Rate}
  - {id: DGS10,        domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 10-Year Treasury Constant Maturity}
  - {id: DGS20,        domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 20-Year Treasury Constant Maturity Rate}
  - {id: DGS30,        domain: monetary_policy, frequency: daily,   cadence: daily,   regime_input: false, description: 30-Year Treasury Constant Maturity}
  - {id: MORTGAGE30US, domain: monetary_policy, frequency: weekly,  cadence: weekly,  regime_input: false, description: 30-Year Fixed Rate Mortgage Average}
  - {id: IORB,         domain: monetary_policy, frequency: daily,   cadence: weekly,  regime_input: false, description: Interest on Reserve Balances Rate}
  - {id: EFFR,         domain: monetary_policy, frequency: daily,   cadence: weekly,  regime_input: false, description: Effective Federal Funds Rate SOFR era}
  - {id: SOFR,         domain: monetary_policy, frequency: daily,   cadence: weekly,  regime_input: false, description: Secured Overnight Financing Rate}

  # ── 2. Inflation (9) ──────────────────────────────────────────────────────
  - {id: CPIAUCSL,     domain: inflation, frequency: monthly, cadence: weekly,  regime_input: true,  description: CPI All Urban Consumers — headline inflation}
  - {id: CPILFESL,     domain: inflation, frequency: monthly, cadence: weekly,  regime_input: false, description: CPI Core ex food & energy}
  - {id: PCEPI,        domain: inflation, frequency: monthly, cadence: weekly,  regime_input: false, description: PCE Price Index — Fed preferred gauge}
  - {id: PCEPILFE,     domain: inflation, frequency: monthly, cadence: weekly,  regime_input: false, description: PCE Core ex food & energy}
  - {id: PPIFIS,       domain: inflation, frequency: monthly, cadence: weekly,  regime_input: false, description: PPI Final Demand — upstream inflation}
  # REMOVED ADR-041: PPIFGS (discontinued by BLS ~Feb 2016; frozen at
  # 2015-12-01 in the 14 Aug 2026 live check — redundant w/ PPIFIS above,
  # which already covers modern Final-Demand PPI and confirmed fresh
  # 2026-07 the same run).
  - {id: PPIACO,       domain: inflation, frequency: monthly, cadence: weekly,  regime_input: false, description: PPI All Commodities}
  - {id: T5YIE,        domain: inflation, frequency: daily,   cadence: daily,   regime_input: false, description: 5-Year Breakeven Inflation Rate}
  - {id: T10YIE,       domain: inflation, frequency: daily,   cadence: daily,   regime_input: false, description: 10-Year Breakeven Inflation Rate}
  - {id: MICH,         domain: inflation, frequency: monthly, cadence: monthly, regime_input: false, description: U Michigan Inflation Expectation}

  # ── 3. Growth & Output (8) ────────────────────────────────────────────────
  - {id: A191RL1Q225SBEA, domain: growth, frequency: quarterly, cadence: weekly,   regime_input: true,  description: Real GDP Growth Rate quarterly}
  - {id: GDPC1,           domain: growth, frequency: quarterly, cadence: weekly,   regime_input: false, description: Real GDP Level}
  - {id: INDPRO,          domain: growth, frequency: monthly,   cadence: weekly,   regime_input: false, description: Industrial Production Index}
  - {id: TCU,             domain: growth, frequency: monthly,   cadence: weekly,   regime_input: false, description: Capacity Utilization}
  - {id: RSAFS,           domain: growth, frequency: monthly,   cadence: weekly,   regime_input: false, description: Advance Retail Sales}
  - {id: RSXFS,           domain: growth, frequency: monthly,   cadence: weekly,   regime_input: false, description: Retail Sales ex Food Service}
  - {id: DGORDER,         domain: growth, frequency: monthly,   cadence: weekly,   regime_input: false, description: Durable Goods Orders — capex signal}
  - {id: NEWORDER,        domain: growth, frequency: monthly,   cadence: weekly,   regime_input: false, description: Manufacturers New Orders — demand leading}
  # REMOVED ADR-041: NAPM, NMFCI (both HTTP 400 in the 14 Aug 2026 live
  # check — deleted from FRED 2016-06-24 at ISM's own request; no free
  # replacement exists, ISM data is paid-license only. Invisible in
  # fred_ingester.py's success/failed telemetry until now — pure dead
  # weight in the registry.)

  # ── 4. Labor Market (8) ────────────────────────────────────────────────────
  - {id: UNRATE,         domain: labor, frequency: monthly, cadence: weekly,  regime_input: false, description: Unemployment Rate — lagging indicator}
  - {id: U6RATE,         domain: labor, frequency: monthly, cadence: weekly,  regime_input: false, description: U-6 Underemployment Rate}
  - {id: PAYEMS,         domain: labor, frequency: monthly, cadence: weekly,  regime_input: false, description: Nonfarm Payroll — monthly jobs added}
  - {id: ICSA,           domain: labor, frequency: weekly,  cadence: weekly,  regime_input: false, description: Initial Jobless Claims — weekly leading}
  - {id: CCSA,           domain: labor, frequency: weekly,  cadence: weekly,  regime_input: false, description: Continuing Jobless Claims}
  - {id: CIVPART,        domain: labor, frequency: monthly, cadence: weekly,  regime_input: false, description: Labor Force Participation Rate}
  - {id: CES0500000003,  domain: labor, frequency: monthly, cadence: weekly,  regime_input: false, description: Average Hourly Earnings — wage inflation}
  - {id: JTSJOL,         domain: labor, frequency: monthly, cadence: weekly,  regime_input: false, description: Job Openings JOLTS — labor demand}

  # ── 5. Credit & Financial Conditions (9) ──────────────────────────────────
  - {id: BAMLH0A0HYM2,    domain: credit, frequency: daily,   cadence: daily,  regime_input: true,  description: ICE BofA US High Yield Spread — credit stress}
  - {id: BAMLC0A0CM,      domain: credit, frequency: daily,   cadence: daily,  regime_input: false, description: ICE BofA US Corporate Bond Spread — IG}
  - {id: NFCI,            domain: credit, frequency: weekly,  cadence: weekly, regime_input: true,  description: Chicago Fed National Financial Conditions Index}
  - {id: STLFSI4,         domain: credit, frequency: weekly,  cadence: weekly, regime_input: false, description: St. Louis Fed Financial Stress Index}
  - {id: DCOILWTICO,      domain: credit, frequency: daily,   cadence: daily,  regime_input: false, description: WTI Crude Oil Price daily}
  # REMOVED ADR-041: GOLDAMGBD228NLBM (HTTP 400 in the 14 Aug 2026 live
  # check — deleted from FRED 2022-01-31, ICE Benchmark Administration
  # data removal, no replacement; redundant w/ gold coverage already live
  # via yfinance AU/GC=F in Layer 1).
  - {id: DEXUSEU,         domain: credit, frequency: daily,   cadence: daily,  regime_input: true,  description: USD/EUR Exchange Rate daily}
  - {id: DEXJPUS,         domain: credit, frequency: daily,   cadence: daily,  regime_input: false, description: USD/JPY Exchange Rate daily}
  - {id: M2SL,            domain: credit, frequency: monthly, cadence: weekly, regime_input: false, description: M2 Money Supply — liquidity proxy}
  - {id: WALCL,           domain: credit, frequency: weekly,  cadence: weekly, regime_input: false, description: Fed Total Assets — balance sheet proxy}

  # ── 6. Housing & Consumer (9) ─────────────────────────────────────────────
  - {id: HOUST,          domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: Housing Starts — construction activity}
  - {id: PERMIT,         domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: Building Permits — forward-looking housing}
  - {id: HSN1F,          domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: New Home Sales}
  - {id: EXHOSLUSM495S,  domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: Existing Home Sales}
  - {id: UMCSENT,        domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: U Michigan Consumer Sentiment}
  # REMOVED ADR-041: CSCICP03USM665S (frozen at 2024-01 in the 14 Aug 2026
  # live check — Canada sibling series in the same OECD family already
  # carries FRED's explicit (DISCONTINUED) tag; redundant w/ UMCSENT
  # above, confirmed fresh the same run).
  - {id: PSAVERT,        domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: Personal Saving Rate}
  - {id: PCE,            domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: Personal Consumption Expenditures level}
  - {id: DRSFRMACBS,     domain: housing, frequency: quarterly, cadence: weekly, regime_input: false, description: Mortgage Delinquency Rate}
  - {id: TOTALSL,        domain: housing, frequency: monthly, cadence: weekly, regime_input: false, description: Total Consumer Credit — household debt}

  # ── VIX (special — via FRED proxy) ────────────────────────────────────────
  - {id: VIXCLS,         domain: volatility, frequency: daily,  cadence: daily, regime_input: true, description: CBOE Volatility Index VIX — regime primary input}

  # ── 7. Commodity — Track 2 (6) ─────────────────────────────────────────────────────────
  # ADD RISK-15 fix (Ovi, 8 Aug 2026): Architecture Extension v1.0 ADR-005/006
  # decided PIORECRORECUSDM (Iron Ore) and PCOALAUUSDM (Coal Australia) as
  # monthly FRED supplements to the daily equity proxies (VALE, WHC.AX) —
  # never actually added to this file. GMI_Decision_Document_v7.docx
  # (ADR-030-033, 30 Jul 2026) implied 4 more of the same shape for the
  # CPO/RUBBER/TIN/NICKEL proxy adoption — also never added. All 6
  # verified against live FRED (web search, fred.stlouisfed.org) this
  # thread: 5 confirmed correct as documented, 1 corrected — Iron Ore's
  # real series ID is PIORECRUSDM, not PIORECRORECUSDM (the latter does
  # not exist; a duplicated "ORE" typo carried across Architecture
  # Extension v1.0 and this project's own KNOWN_RISKS.md RISK-15 entry,
  # unverified until now). regime_input: false for all six — these are
  # Track 2 supplements for the future ForecastModule (GMI Wave 1 Cycle
  # 4, not yet built), not macro-regime inputs. No live Silver/Gold
  # consumer yet — fred_ingester.py and macro_processor.py are both
  # domain-agnostic (confirmed by direct read this thread), so this is a
  # pure config addition, no source changes required to activate ingestion.
  - {id: PIORECRUSDM, domain: commodity, frequency: monthly, cadence: weekly, regime_input: false, description: Global price of Iron Ore — Track 2 supplement for IRON_ORE/VALE proxy (ADR-005)}
  - {id: PCOALAUUSDM, domain: commodity, frequency: monthly, cadence: weekly, regime_input: false, description: Global price of Coal Australia — Track 2 supplement for COAL_NEWC/WHC.AX proxy (ADR-006)}
  - {id: PPOILUSDM,   domain: commodity, frequency: monthly, cadence: weekly, regime_input: false, description: Global price of Palm Oil — Track 2 supplement for CPO/F34.SI proxy (ADR-030)}
  - {id: PRUBBUSDM,   domain: commodity, frequency: monthly, cadence: weekly, regime_input: false, description: Global price of Rubber — Track 2 supplement for RUBBER/STA.BK proxy (ADR-031)}
  - {id: PTINUSDM,    domain: commodity, frequency: monthly, cadence: weekly, regime_input: false, description: Global price of Tin — Track 2 supplement for TIN/AFM.V proxy (ADR-032)}
  - {id: PNICKUSDM,   domain: commodity, frequency: monthly, cadence: weekly, regime_input: false, description: Global price of Nickel — Track 2 supplement for NICKEL/NIC.AX proxy (ADR-033)}
