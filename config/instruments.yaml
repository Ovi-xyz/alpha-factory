      notes: 'ADR-024: USD/MYR, confirmed live as MYR=X (Yahoo Finance canonical form, same <currency>=X convention as JPY=X/HKD=X/SGD=X/IDR=X — differs from the USD<CCY>=X convention used for context_dollar_basket above by explicit ADR choice). Sole consumer: Silver-layer CPO normalization (ADR-023). Not consumed by CrossAssetEngine, gold_signals, or gold_screener.'
  rates:
    fed:
      _meta:
        subcategory_id: context_rates_fed
        source: fred
        description: FED policy rates — FRED API exclusive
        # FIX ADR-019 (GMI_Decision_Document_v1.docx): contributes_to emptied.
        # Previously carried undocumented weights into score_dollar_strength
        # (0.30) and score_yield_curve (0.20) with no traceable rationale —
        # neither appears in Architecture Extension v1.0 §5.2's original
        # contributor tables nor Data Source & Rates Adjustment v1.0 §7's
        # revised tables. Restoring either requires a new, explicit,
        # documented follow-on ADR, not silent reinstatement.
        contributes_to: []
        series:
        - SOFR
        - FEDFUNDS
        - IORB
        - EFFR
        series_count: 4
    curve:
      _meta:
        subcategory_id: context_rates_curve
        source: fred
        description: US Treasury yield curve — key tenors
        contributes_to:
        - score: score_yield_curve
          weight: 0.5
        - score: score_dollar_strength
          weight: 0.3
        series:
        - DGS2
        - DGS5
        - DGS10
        - DGS30
        series_count: 4
    spread:
      _meta:
        subcategory_id: context_rates_spread
        source: fred
        description: Yield curve spread — recession signal
        # FIX ADR-019: score_inflation_pressure entry (weight 0.22) restored.
        # It matches Data Source & Rates Adjustment v1.0 §7.4's documented
        # table but had been displaced by an undocumented
        # context_commodity_coal contribution at the same weight — see
        # context.commodity.coal._meta above, now corrected to omit it.
        contributes_to:
        - score: score_yield_curve
          weight: 0.5
        - score: score_credit_stress
          weight: 0.5
        - score: score_inflation_pressure
          weight: 0.22
        series:
        - T10Y2Y
        - T10Y3M
        series_count: 2
    dm_cb:
      _meta:
        subcategory_id: context_rates_dm_cb
        source: bis_cbpol_d
        description: G10 ex-FED central bank policy rates — BIS CBPOL_D
        # FIX ADR-019: score_yield_curve entry (weight 0.10) removed — it was
        # undocumented in both Architecture Extension v1.0 §5.2 and Data
        # Source & Rates Adjustment v1.0 §7's contributor tables for
        # score_yield_curve. score_dollar_strength and score_global_growth
        # contributions below are unchanged (they match those tables).
        contributes_to:
        - score: score_dollar_strength
          weight: 0.2
          aggregation: rate_differential_fed_minus_dm_weighted
        - score: score_global_growth
          weight: 0.1
          aggregation: z_score_level_inverted_mean
        central_banks:
        - ECB
        - BOE
        - BOJ
        - BOC
        - RBA
        - RBNZ
        - SNB
        - NORGES
        - RIKSBANK
        ref_area_codes:
          ECB: XM
          BOE: GB
          BOJ: JP
          BOC: CA
          RBA: AU
          RBNZ: NZ
          SNB: CH
          NORGES: 'NO'
          RIKSBANK: SE
        reliability_notes: 'BOJ: YCC 2016-2024 causes rate_bps to be flat -10bps — registered. SNB: Negative rate -75bps (2015-2022)
          — StandardScaler handles range.'
    em_cb:
      _meta:
        subcategory_id: context_rates_em_cb
