context:
  dollar:
    _meta:
      subcategory_id: context_dollar
      source: yfinance
      description: US Dollar Index — primary macro anchor
      contributes_to:
      - score: score_dollar_strength
        weight: 0.5
        aggregation: z_score_level
    instruments:
    - symbol: DXY
      layer: 2
      context_category: context_dollar
      context_group: dollar
      context_available: true
      include_in_forecast: true
      reclassified_from: layer_1_forex
  # ADD ADR-013/014/015/016 (GMI_Decision_Document_v1.docx): Broad Dollar
  # Index basket-input completion. Architecture v2.0 §7.2's own
  # compute_broad_dollar() design specifies 10 forex pairs as inputs; only
  # 6 (EUR_USD, USD_JPY, GBP_USD, USD_CAD, USD_CHF, AUD_USD — all Layer 1)
  # plus USD_IDR (Layer 1, weight logic changes per ADR-018) existed
  # anywhere in the universe. These 6 net-new EM/DM-differentiating legs
  # close that gap. contributes_to is deliberately empty — this subcategory
  # supplies raw Bronze/Silver ingestion for a future CrossAssetEngine
  # compute_broad_dollar() to consume directly (hardcoded-basket-dict
  # pattern, same as the original design), NOT a domain-score contributor
  # in its own right (ADR-014). Per-currency basket weights (incl. HKD's
  # near-zero token weight, ADR-015; IDR's platform-relevance override,
  # ADR-018) are a CrossAssetEngine-internal concern, not yet built —
  # see GMI_Decision_Document_v1.docx §6 Gate 1 (BIS EER weight-component
  # sourcing, blocking exact numeric values) and §8 Gate 2 (yfinance ticker
  # convention, non-blocking — USD<CCY>=X used here for consistency with
  # the existing USD_CAD/USD_CHF/USD_JPY convention, live-unconfirmed for
  # the 6 currencies below except CNH per ADR-013).
  # UPD ADR-036 (GMI_Decision_Document_v8.docx, 10 Aug 2026): the 7th
  # basket leg, IDR, joined this group — see its own entry below for the
  # reclassification rationale (was Layer 1 USD_IDR). Basket-input
  # completion is now 7/7 within a single group, not 6+1 split across
  # Layer 1/Layer 2.
  dollar_basket:
    _meta:
      subcategory_id: context_dollar_basket
      source: yfinance
      description: Broad Dollar Index basket-completion currencies — EM/DM legs beyond DXY's 6-currency
        composition
      contributes_to: []
    instruments:
    - symbol: CNH
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      notes: >-
        ADR-013: offshore renminbi (not onshore CNY) — avoids PBOC
        policy-rate/managed-FX double-counting with context_rates_em_cb.
        ADR-048 (USD/CNH Source Adjustment Addendum v1.0, 29 Aug 2026):
        the "ticker confirmed live" claim above was wrong for USDCNH=X —
        live/preflight testing found it returns only 1 row. CNH=F (futures,
        thin OI, quarterly roll basis) and the CNH=X alias (same sparsity)
        were investigated and rejected too. CNY=X (onshore) is clean but
        economically distinct — a managed PBOC rate that decouples from
        offshore CNH by hundreds of pips exactly during the regime-stress
        episodes score_em_risk exists to detect. Source reassigned
        exclusively to AlphaVantage FX_DAILY(USD,CNH) — see data_source/
        from_symbol/to_symbol in instruments_identity.yaml.
    - symbol: KRW
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      notes: Ticker convention unconfirmed live — Gate 2 (GMI_Decision_Document_v1.docx §6), non-blocking.
    - symbol: SGD
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      notes: 'ADR-016: included on standalone FX-policy grounds — MAS manages policy via the S$NEER exchange-rate
        band rather than an interest rate, making SGD a direct policy-transmission signal (no CB-rate
        or equity-index anchor elsewhere in the universe). Ticker convention unconfirmed live — Gate 2,
        non-blocking.'
    - symbol: HKD
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      reliability_flag: true
      notes: 'ADR-015: Hong Kong Linked Exchange Rate System pegs HKD to USD in a ~7.75-7.85 band since
        1983 — near-flat noise under normal conditions, included at a near-zero token basket weight (exact
        value set inside CrossAssetEngine when built) rather than excluded outright, so a future peg-break
        event is not structurally invisible. Same reliability_flag pattern as SSEC (Architecture v2.0
        §3.5) and the BOJ YCC annotation. Ticker convention unconfirmed live — Gate 2, non-blocking.'
    - symbol: TWD
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      notes: Ticker convention unconfirmed live — Gate 2, non-blocking.
    - symbol: NOK
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      notes: DM basket leg. Ticker convention unconfirmed live — Gate 2, non-blocking.
    # ADD ADR-036 (GMI_Decision_Document_v8.docx, 10 Aug 2026): USD_IDR
    # reclassified out of Layer 1 forex — completes the Broad Dollar
    # basket's 13th leg entirely within dollar_basket (previously split
    # 7 Layer 1 / 6 Layer 2, per the ADD ADR-013/014/015/016 comment
    # above). Ovi's rationale: Indonesia exposure is already carried by
    # 30 IDX30 equities plus BI's central-bank-rate context anchor
    # (2x-weighted in score_em_risk, Data Source & Rates Adjustment v1.0
    # §7.2) — USD/IDR as a standalone Layer 1 trading pair was redundant
    # with that existing exposure. Drops out of gold_signals/gold_mtf/
    # gold_screener eligibility — the explicit, confirmed trade-off.
    - symbol: IDR
      layer: 2
      context_category: context_dollar_basket
      context_group: dollar_basket
      context_available: true
      include_in_forecast: true
      reclassified_from: layer_1_forex
      notes: 'ADR-036: was USD_IDR (Layer 1 forex) — renamed IDR to match dollar_basket''s bare-currency-code
        convention, raw_symbol dropped. Ticker unchanged (USDIDR=X).'
  # ADD ADR-024 (GMI_Decision_Document_v2.docx): point-fix FX anchor for
  # a single deferred commodity's future local-currency->USD Silver-layer
  # normalization. Deliberately NOT folded into context_dollar_basket
  # above — two unrelated purposes (Broad Dollar Index computation vs. a
  # single commodity's currency conversion) kept under separate labels
  # per ADR-024's rationale. contributes_to is empty: zero domain-score
  # weight. NOT a CrossAssetEngine input when that engine is built.
  # UPD ADR-037 (GMI_Decision_Document_v8.docx, 10 Aug 2026): original
  # MYR entry (for CPO's original FCPO Bursa Malaysia plan) removed —
  # orphaned since ADR-030 re-sourced CPO to F34.SI (SGD-denominated).
  # Replaced with THB, for a future STA.BK/RUBBER normalization step —
  # see the subcategory's own _meta.note below for why AUD/CAD/SGD are
  # deliberately not also added here.
  fx_normalization:
    _meta:
      subcategory_id: context_fx_normalization
      source: yfinance
      description: Single-purpose FX anchor(s) for commodity currency normalization — not a CrossAssetEngine
        input
