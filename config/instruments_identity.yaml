    em:
      instruments:
      - symbol: TWSE
        yfinance_symbol: ^TWII
        timezone: Asia/Taipei
      - symbol: KOSPI
        yfinance_symbol: ^KS11
        timezone: Asia/Seoul
      - symbol: HSI
        yfinance_symbol: ^HSI
        timezone: Asia/Hong_Kong
      - symbol: SSEC
        # FIX (alpha-factory_preflight_logs 28 July 2026): ^SSEC returns
        # HTTP 404 on live yfinance ("possibly delisted"). Confirmed via
        # web search: Yahoo Finance's actual symbol is 000001.SS (Shanghai
        # Stock Exchange suffix convention -- same pattern as .JK for
        # Jakarta already used elsewhere in this file, .AX for ASX, etc.).
        # ^SSEC is a ticker used by other data vendors (CNBC, Investing.com)
        # but is not yfinance's canonical form.
        yfinance_symbol: 000001.SS
        timezone: Asia/Shanghai
      - symbol: JKSE
        yfinance_symbol: ^JKSE
        timezone: Asia/Jakarta
    volatility:
      instruments:
      - symbol: VIX
        yfinance_symbol: ^VIX
        timezone: America/New_York
  commodity:
    energy:
      instruments:
      - symbol: BRENT
        yfinance_symbol: BZ=F
        timezone: UTC
      - symbol: NG
        yfinance_symbol: NG=F
        timezone: UTC
    metals:
      instruments:
      - symbol: COPPER
        yfinance_symbol: HG=F
        timezone: UTC
      - symbol: NICKEL
        # FIX ADR-033 (GMI_Decision_Document_v7.docx, 30 Jul 2026): NI=F
        # confirmed 404 on live yfinance (28 Jul 2026 preflight log; deferred
        # then). Adopted NIC.AX (Nickel Industries Ltd, ASX) as daily equity
        # proxy -- confirmed live via check_yfinance_tickers.py --candidates
        # (30 Jul 2026 verify-preflight log, 5 rows returned). Same pattern
        # as IRON_ORE/VALE and COAL_NEWC/WHC.AX below -- no base_currency
        # flag, consistent with those two (equity proxy, not a raw
        # currency-denominated commodity feed).
        yfinance_symbol: NIC.AX
        proxy_instrument: NIC.AX
        timezone: Australia/Sydney
      - symbol: ALUMINIUM
        yfinance_symbol: ALI=F
        timezone: UTC
      - symbol: ZINC
        yfinance_symbol: ZN=F
        timezone: UTC
      - symbol: IRON_ORE
        yfinance_symbol: VALE
        proxy_instrument: VALE
        timezone: America/New_York
      - symbol: TIN
        # FIX ADR-032 (GMI_Decision_Document_v7.docx, 30 Jul 2026): tvdatafeed
        # retired (ADR-029) before TIN ever got live wiring -- OD-C1 preflight
        # (29 Jul 2026) confirmed LME:SN empty-result/timeout. Adopted AFM.V
