# ADD Decision B Step 1 (GMI_Decision_Document_v3.docx, 2026-07-17):
# commodity_role/commodity_subcategory added to all 14 commodity
# instruments (3 here + 11 in context.commodity below) — Architecture
# v2.1 Addendum §7.1 specified these fields down to the code, but zero
# occurrences existed anywhere in this file until now (confirmed via
# grep before this change). commodity_role='trading' here matches these
# 3 being the only commodity instruments actually eligible for
# gold_screener (Addendum §2.1).
commodity:
  Gold/Silver/Oil:
  - symbol: AG
    commodity_role: trading
    commodity_subcategory: precious_metals
  - symbol: AU
    commodity_role: trading
    commodity_subcategory: precious_metals
  - symbol: CL
    commodity_role: trading
    commodity_subcategory: energy
