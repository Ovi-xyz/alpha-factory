        timezone: Australia/Sydney
        # ADD Decision B Step 1: commodity_subcategory=energy (NOT 'coal')
        # per Addendum §8.2's explicit REGIME_SECTOR_WEIGHTS key mapping —
        # "commodity_energy: CL, BRENT, NG, COAL_NEWC". This is deliberately
