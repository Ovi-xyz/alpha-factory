        # FIX ADR-023 (GMI_Decision_Document_v2.docx): RUBBER is USD-native
        # via SICOM/SGX (tvdatafeed SGX|SICOM_TSR20) — it does NOT require
        # MYR->USD normalization. Architecture v2.1 Addendum §5.3 explicitly
        # chose SICOM TSR20 (USD) over TOCOM RSS3 (JPY) specifically to avoid
        # a currency-conversion timestamp/lookahead risk. Still deferred —
