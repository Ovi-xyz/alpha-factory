# config/schemas/finnhub_sentiment.yaml — Bronze Schema Registry (GD §3.7)
#
# Finnhub news sentiment Bronze schema.
# Registered as part of architectural debt elimination refactor:
#   Silver → Finnhub API (GD §17.7 anti-pattern) → Bronze → Finnhub API (GD §17.3 compliant)
#
# Producer : src/bronze/finnhub_sentiment_ingester.py (FinnhubSentimentIngester)
# Consumer : src/silver/sentiment_processor.py (SentimentProcessor — pure read)
# Cadence  : Daily, depends_on=[] (no Silver dependency)
# Scope    : 643 instrument universe via InstrumentLoader
#
# on_mismatch: quarantine — Finnhub schema change triggers quarantine gate (GD §3.7),
# NOT silent-fail. Quarantined files land in data/quarantine/ for investigation.
#
# Field notes:
#   sentiment_score  — nullable: Finnhub coverage limited to US stocks.
#                      IDX/forex/commodity symbols are skipped (return None from _fetch_one),
#                      so nulls in sentiment_score reflect partial API coverage, not errors.
#   buzz_score       — nullable: same reason as sentiment_score.
#   news_volume_7d   — nullable: same reason as above.
#   symbol           — NOT nullable: every ingested record must have a symbol.
#   source           — NOT nullable: must always be "finnhub" for traceability.
#   fetched_date     — NOT nullable: required for Silver to filter by run_date.

version: "2026-06"
source: finnhub
domain: sentiment
on_mismatch: quarantine

expected_columns:
  - name: symbol
    type: string
    nullable: false

  - name: sentiment_score
    type: float64
    nullable: true   # null acceptable — Finnhub coverage limited to US stocks

  - name: buzz_score
    type: float64
    nullable: true

  - name: news_volume_7d
    type: int64
    nullable: true

  - name: source
    type: string
    nullable: false   # always "finnhub" — enforced in _fetch_one()

  - name: fetched_date
    type: string
    nullable: false   # Silver filters Bronze by this column — must be present
