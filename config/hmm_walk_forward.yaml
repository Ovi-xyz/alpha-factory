# hmm_walk_forward.yaml -- ADR-053 (GMI-XGB-001) D2: honest as-of HMM history for hmm_xgboost.
# Read only by src/gold/hmm/walk_forward.py (job gold_hmm_walk_forward).
#
#   refit_months          fold length. The model scoring a row dated D was fitted on raw-panel
#                         rows strictly before the fold start F <= D (expanding window).
#                         Production refits weekly; 3 months is a cost/fidelity compromise
#                         (KNOWN_RISKS RISK-40). Must divide a year: 1,2,3,4,6,12.
#   macro_first_fold      first macro fold start. raw_macro starts 1996-08; 2011-01 gives every
#                         macro domain 14+ years of training behind its first out-of-sample row
#                         and matches the earliest daily-bar history the labels can use.
#   market_min_train_obs  the market panel starts 2016-09; the first fold is the first boundary
#                         with this many complete-case rows behind it (500 ~ two trading years).
refit_months: 3
macro_first_fold: "2011-01-01"
market_min_train_obs: 500
