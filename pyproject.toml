# near-today last_date for 1W/1M (trivial ~7-day fetch instead of a
# multi-year cold-start backfill), AND the write-side same-day idempotency
# check (FIX GD-F08) then found 1D's file and skipped 1W/1M's write
# entirely -- confirmed via a direct read of base_ingester.py this thread,
# matching the exact "[Bronze] Idempotent skip" log line from the 21 Aug
# 2026 live-test bug report. Fix: timeframe folded into both paths at the
# call site only (asset_class=f"market/ohlcv/{market}/timeframe={tf}") --
# BronzeIngester/IncFetchProtocol signatures unchanged, since they are
# shared by every non-OHLCV Bronze domain (FRED/BLS/BEA/Treasury/IMF/BIS),
# none of which have a timeframe concept.
